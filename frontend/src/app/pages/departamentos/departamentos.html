<div class="contenedor">
    <h1>Departamentos</h1>
    <button class="boton-primario boton-agregar" (click)="abrirModal()">Agregar</button>
  </div>
  
  <div class="tabla-contenedor">
    <table class="tabla tabla-striped">
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dep of departamentos">
          <td>{{ dep.codigo }}</td>
          <td>{{ dep.nombre }}</td>
          <td>
            <button class="boton-editar" (click)="editar(dep)">Editar</button>
            <button class="boton-primario boton-eliminar" (click)="eliminar(dep._id!)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Modal -->
  <div class="modal" *ngIf="mostrarModal">
    <div class="modal-contenido">
      <h3>{{ editando ? 'Editar Departamento' : 'Nuevo Departamento' }}</h3>
  
      <form (ngSubmit)="guardar()">
        <div class="campo">
          <label>Código</label>
          <input type="number" [(ngModel)]="departamento.codigo" name="codigo" required>
        </div>
  
        <div class="campo">
          <label>Nombre</label>
          <input type="text" [(ngModel)]="departamento.nombre" name="nombre" required>
        </div>
  
        <div class="botones">
          <button type="button" class="boton-cancelar" (click)="cerrarModal()">Cancelar</button>
          <button type="submit" class="boton-primario boton-guardar">Guardar</button>
        </div>
      </form>
    </div>
  </div>
